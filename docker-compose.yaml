x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - BACKEND_DB_NAME=${BACKEND_DB_NAME:?}
      - BACKEND_DB_USER=${BACKEND_DB_USER:?}
      - BACKEND_DB_PASSWORD=${BACKEND_DB_PASSWORD:?}
      - CMS_DB_NAME=${CMS_DB_NAME:?}
      - CMS_DB_USER=${CMS_DB_USER:?}
      - CMS_DB_PASSWORD=${CMS_DB_PASSWORD:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-d",
          "postgres",
          "-U",
          "${POSTGRES_USER}",
          "-q",
        ]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    networks:
      - default_network
    logging: *default-logging

  rustfs:
    profiles: [dev]
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-}
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - 127.0.0.1:${RUSTFS_PORT:-9000}:9000
      - 127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    networks:
      - default_network
    logging: *default-logging

  s3_init:
    image: amazon/aws-cli:2.27.0
    container_name: s3_init
    entrypoint: ["/bin/bash", "/init.sh"]
    environment:
      - AWS_ENDPOINT_URL=${S3_ENDPOINT:-http://rustfs:9000}
      - AWS_DEFAULT_REGION=${S3_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY}}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY}}
      - S3_BUCKET=${S3_BUCKET:-${RUSTFS_BUCKET}}
    volumes:
      - ./infra/s3/init.sh:/init.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy
        required: false
    restart: "no"
    networks:
      - default_network
    logging: *default-logging

volumes:
  postgres_data:
  rustfs_data:

networks:
  default_network:
    driver: bridge
