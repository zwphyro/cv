version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout

loggers:
  src:
    level: INFO
    handlers: [console]
    propagate: false

  __main__:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
