version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7"]
      - dependency-name: "eslint"
        versions: [">= 10"]
      - dependency-name: "graphql"
        versions: [">= 17"]
      - dependency-name: "@types/node"
        versions: [">= 25"]
    open-pull-requests-limit: 10

  - package-ecosystem: "uv"
    directories:
      - "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      database:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "asyncpg"
      lint:
        patterns:
          - "ruff"
          - "basedpyright"
          - "import-linter"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/apps/backend"
      - "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "node"
        versions: [">= 25"]
    open-pull-requests-limit: 10
